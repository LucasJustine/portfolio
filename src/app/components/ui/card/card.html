<div
  class="h-full border border-border bg-panel p-6 transition duration-100 ease-out"
  [class.cursor-pointer]="clickable()"
  [class.hover:border-primary]="clickable()"
  [class.hover:bg-panel-hover]="clickable()"
  [class.active:scale-[.99]]="clickable()"
  [attr.role]="clickable() ? 'button' : null"
  [attr.tabindex]="clickable() ? 0 : null"
  (click)="onClick()"
  (keydown)="onKeydown($event)"
>
  <ng-content />
</div>
